# Cloudflare Workers の設定。GitHub Actions から `wrangler deploy` で公開する。
name = "aiaxislab"
main = "worker/index.js"
compatibility_date = "2026-10-01"
workers_dev = false

routes = [
  { pattern = "aiaxislab.win", custom_domain = true },
  { pattern = "boat.aiaxislab.win", custom_domain = true },
]

[assets]
directory = "site"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "boatlab"

# 30分おき：使用量のチェック（worker/guard.js）と、6:00〜8:30（日本時間）の毎朝のメール（worker/mail.js）
# 5分おき（8:00〜10:55）：FXの毎朝8:30の判定のメール（worker/fx/fx.js の FX_CRON と同じ文字列にする）
[triggers]
# 1分おき（8:00〜23:59）：BoatLab AI 2 の締切5分前の判定と答え合わせ（worker/ai2/ai2.js の AI2_CRON と同じ文字列にする）
crons = ["*/30 * * * *", "*/5 23,0,1 * * *", "* 23,0-14 * * *"]

# PDF・公開データの取りすぎ防止（1つのIPあたり60秒で120回まで。worker/guard.js の RATE と同じ値にする）
[[ratelimits]]
name = "RATE_LIMIT"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 120
  period = 60

# Cloudflare Email Routing で確認済みのアドレスにだけ送れる。送り先は Secrets の MAIL_TO
[[send_email]]
name = "MAIL"
