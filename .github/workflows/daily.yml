name: 毎朝のPDF作成
on:
  schedule:
    - cron: "30 20 * * *" # 毎日 5:30（日本時間）。GitHubの都合で数十分遅れることがある
  pull_request: # 変更の確認用。今日（日本時間）の分を作るだけで、データ保存とアップロードはしない
    paths: ["boatlab/**", "templates/**", "scripts/**", ".github/workflows/daily.yml", "requirements.txt"]
  workflow_dispatch:
    inputs:
      date:
        description: "対象日（YYYY-MM-DD）。空なら今日"
        required: false
      upload:
        description: "Cloudflare R2 にアップロードする"
        type: boolean
        default: true

permissions:
  contents: write

concurrency: daily

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: これまでのデータ（data ブランチ）を取り出す
        run: |
          if git fetch --depth 1 origin data; then
            git worktree add state FETCH_HEAD
          else
            mkdir state
          fi

      - name: 道具の準備
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lhasa fonts-noto-cjk > /dev/null
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: |
          pip install -q -r requirements.txt
          npm install --no-audit --no-fund
          npx playwright install chromium

      - name: 管理者ダッシュボードのCSVを R2 から取ってくる
        if: env.CLOUDFLARE_API_TOKEN != '' && github.event_name != 'pull_request'
        run: |
          # 無いとき（初回・クリア直後）だけ空から作り直す。通信エラーなどのときは止める（記録を消さないため）
          get() {
            if out=$(npx wrangler r2 object get "boatlab/$1" --file "out/$1" --remote 2>&1); then
              echo "$1 を取得しました"
            elif echo "$out" | grep -q "The specified key does not exist"; then
              rm -f "out/$1"; echo "$1 はまだありません"
            else
              echo "$out"; exit 1
            fi
          }
          mkdir -p out/admin/ml
          get admin/races.csv
          get admin/meta.json
          get admin/ml/model.json # AI学習モデル（週1回の学習で作る。無ければ簡易モデルで予想）
          mkdir -p out/admin/ai2
          get admin/ai2/log.csv # BoatLab AI 2 の記録（結果が空欄の行を、公式の成績で埋める）
          [ -f out/admin/ai2/log.csv ] && md5sum out/admin/ai2/log.csv > ai2-log.md5 || true

      - name: PDFを作る
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python -m boatlab.daily --date "$(TZ=Asia/Tokyo date +%F)"
          else
            python -m boatlab.daily ${{ inputs.date && format('--date {0}', inputs.date) || '' }}
          fi

      - name: データを data ブランチに保存
        if: github.event_name != 'pull_request'
        run: |
          cd state
          if [ -e .git ]; then git checkout -q -B data; else git init -q -b data; fi
          git add -A
          git -c user.name="BoatLab AI" -c user.email="actions@users.noreply.github.com" commit -qm "$(date -u +%F) のデータ" || exit 0
          git push -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:data

      - name: Cloudflare R2 にアップロード
        if: env.CLOUDFLARE_API_TOKEN != '' && (github.event_name == 'schedule' || inputs.upload)
        run: |
          for f in out/pdf/*/*.pdf; do
            key="${f#out/}"
            npx wrangler r2 object put "boatlab/$key" --file "$f" --content-type application/pdf --remote
          done
          for f in out/data/*.json; do
            key="${f#out/}"
            npx wrangler r2 object put "boatlab/$key" --file "$f" --content-type "application/json; charset=utf-8" --remote
          done
          npx wrangler r2 object put boatlab/admin/races.csv --file out/admin/races.csv --content-type "text/csv; charset=utf-8" --remote
          npx wrangler r2 object put boatlab/admin/picks.json --file out/admin/picks.json --content-type "application/json; charset=utf-8" --remote
          # BoatLab AI 2：全組み合わせの確率（締切5分前に Worker がオッズと比べる）
          for f in out/admin/ai2/probs/*.json out/admin/ai2/schedule.json; do
            key="${f#out/}"
            npx wrangler r2 object put "boatlab/$key" --file "$f" --content-type "application/json; charset=utf-8" --remote
          done
          # 記録は結果を埋めたときだけ戻す（Worker が書いた行を上書きしないように）
          if [ -f ai2-log.md5 ] && ! md5sum -c --quiet ai2-log.md5 2>/dev/null; then
            npx wrangler r2 object put boatlab/admin/ai2/log.csv --file out/admin/ai2/log.csv --content-type "text/csv; charset=utf-8" --remote
          fi
          # 以前は成績を公開していた。今は管理者ダッシュボードだけで見るので、公開側のファイルは消す
          npx wrangler r2 object delete boatlab/data/stats.json --remote || true

      - name: 作ったPDFを Actions の画面から落とせるようにする
        uses: actions/upload-artifact@v4
        with:
          name: pdf
          path: out/pdf/
          retention-days: 3
