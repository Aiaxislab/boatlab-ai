name: サイトを公開
on:
  push:
    branches: [main]
    paths: ["site/**", "worker/**", "wrangler.toml", ".github/workflows/deploy.yml"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 設定キーの確認
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN と CLOUDFLARE_ACCOUNT_ID を Secrets に登録してください（README参照）"
            exit 1
          fi
      - run: npm install --no-audit --no-fund
      - name: R2 バケットの準備（初回のみ作成。PDFは30日で自動削除）
        run: |
          npx wrangler r2 bucket create boatlab || true
          npx wrangler r2 bucket lifecycle add boatlab delete-old-pdf pdf/ --expire-days 30 --force || true
          npx wrangler r2 bucket lifecycle list boatlab
      - name: workers.dev のサブドメインを用意する（毎朝のメールの時刻設定に必要。初回だけ作る）
        continue-on-error: true # 作れなくてもサイトの公開は続ける
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain"
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          current=$(curl -s -H "$auth" "$api" | jq -r '.result.subdomain // empty')
          if [ -n "$current" ]; then echo "作成済み"; exit 0; fi
          # サイトは独自ドメインだけで公開する（wrangler.toml の workers_dev = false）。サブドメインは時刻設定のためだけに作る
          for name in aiaxislab "aiaxislab-$(openssl rand -hex 3)" "aiaxislab-$(openssl rand -hex 4)"; do
            res=$(curl -s -X PUT -H "$auth" -H "Content-Type: application/json" --data "{\"subdomain\":\"$name\"}" "$api")
            if [ "$(echo "$res" | jq -r .success)" = "true" ]; then echo "作成しました"; exit 0; fi
            echo "$res" | jq -c '.errors'
          done
          echo "::error::workers.dev のサブドメインを作れませんでした。Cloudflare の「Compute」→「Workers & Pages」を一度開いてから、もう一度実行してください"
          exit 1
      - name: 公開する（管理者ダッシュボードの設定は Secrets から渡す。リポジトリには書かない）
        env:
          ADMIN_PATH: ${{ secrets.ADMIN_PATH }}
          ACCESS_TEAM: ${{ secrets.ACCESS_TEAM }}
          ACCESS_AUD: ${{ secrets.ACCESS_AUD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          args=(--var "SITE_BYTES:$(du -sb site | cut -f1)")
          if [ -n "$ADMIN_PATH" ] && [ -n "$ACCESS_TEAM" ]; then
            args+=(--var "ADMIN_PATH:$ADMIN_PATH" --var "ACCESS_TEAM:$ACCESS_TEAM")
            [ -n "$ACCESS_AUD" ] && args+=(--var "ACCESS_AUD:$ACCESS_AUD")
          else
            echo "::warning::ADMIN_PATH・ACCESS_TEAM が未登録なので、管理者ダッシュボードは表示されません（README参照）"
          fi
          [ -n "$MAIL_TO" ] && args+=(--var "MAIL_TO:$MAIL_TO")
          npx wrangler deploy "${args[@]}"
