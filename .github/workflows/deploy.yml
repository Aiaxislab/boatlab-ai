name: サイトを公開
on:
  push:
    branches: [main]
    paths: ["site/**", "worker/**", "wrangler.toml", ".github/workflows/deploy.yml"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: 設定キーの確認
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN と CLOUDFLARE_ACCOUNT_ID を Secrets に登録してください（README参照）"
            exit 1
          fi
      - run: npm install --no-audit --no-fund
      - name: R2 バケットの準備（初回のみ作成。PDFは30日で自動削除）
        run: |
          npx wrangler r2 bucket create boatlab || true
          npx wrangler r2 bucket lifecycle add boatlab delete-old-pdf pdf/ --expire-days 30 --force || true
          npx wrangler r2 bucket lifecycle list boatlab
      - run: npx wrangler deploy
