name: サイトを公開
on:
  push:
    branches: [main]
    paths: ["site/**", "worker/**", "wrangler.toml", ".github/workflows/deploy.yml"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: 設定キーの確認
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN と CLOUDFLARE_ACCOUNT_ID を Secrets に登録してください（README参照）"
            exit 1
          fi
      - run: npm install --no-audit --no-fund
      - name: R2 バケットの準備（初回のみ作成。PDFは30日で自動削除）
        run: |
          npx wrangler r2 bucket create boatlab || true
          npx wrangler r2 bucket lifecycle add boatlab delete-old-pdf pdf/ --expire-days 30 --force || true
          npx wrangler r2 bucket lifecycle list boatlab
      - name: 公開する（管理者ダッシュボードの設定は Secrets から渡す。リポジトリには書かない）
        env:
          ADMIN_PATH: ${{ secrets.ADMIN_PATH }}
          ACCESS_TEAM: ${{ secrets.ACCESS_TEAM }}
          ACCESS_AUD: ${{ secrets.ACCESS_AUD }}
        run: |
          args=(--var "SITE_BYTES:$(du -sb site | cut -f1)")
          if [ -n "$ADMIN_PATH" ] && [ -n "$ACCESS_TEAM" ] && [ -n "$ACCESS_AUD" ]; then
            args+=(--var "ADMIN_PATH:$ADMIN_PATH" --var "ACCESS_TEAM:$ACCESS_TEAM" --var "ACCESS_AUD:$ACCESS_AUD")
          else
            echo "::warning::ADMIN_PATH・ACCESS_TEAM・ACCESS_AUD が未登録なので、管理者ダッシュボードは表示されません（README参照）"
          fi
          npx wrangler deploy "${args[@]}"
